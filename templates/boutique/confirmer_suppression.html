{% extends 'base.html' %}

{% block titre %}Supprimer {{ produit.nom }} — EcoGabao{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger border-0 shadow-sm">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Confirmer la suppression</h5>
            </div>
            <div class="card-body text-center p-4">
                <p class="fs-5">Êtes-vous sûr de vouloir supprimer le produit :</p>
                <h4 class="text-danger">« {{ produit.nom }} »</h4>
                <p class="text-muted">Cette action est irréversible.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg me-2">
                        <i class="bi bi-trash"></i> Oui, supprimer
                    </button>
                    <a href="{% url 'mes_produits' %}" class="btn btn-outline-secondary btn-lg">
                        <i class="bi bi-x-lg"></i> Annuler
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
